        /* Custom dark theme background texture pattern mimicking WhatsApp */
        body {
            background-color: #0c1317;
            color: #e9edef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .chat-bg {
            background-color: #0b141a;
            background-image: radial-gradient(#1f2c34 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>

        let activeChatId = 'xii-chemistry';

        function renderChatList(filter = '') {
            const listContainer = document.getElementById('chat-list');
            listContainer.innerHTML = '';

            const filteredChats = chatsData.filter(chat => 
                chat.name.toLowerCase().includes(filter.toLowerCase()) || 
                chat.subtext.toLowerCase().includes(filter.toLowerCase())
            );

            filteredChats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const chatEl = document.createElement('div');
                chatEl.className = `flex items-center px-3 py-3 cursor-pointer hover:bg-[#202c33] transition relative ${isActive ? 'bg-[#2a3942]' : ''}`;
                chatEl.onclick = () => selectChat(chat.id);

                chatEl.innerHTML = `
                    <div class="relative w-12 h-12 rounded-full overflow-hidden mr-3 flex-shrink-0">
                        <img src="${chat.avatar}" alt="${chat.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/40x40/005c4b/ffffff?text=Chat'">
                    </div>
                    <div class="flex-1 min-w-0 border-b border-[#222d34] pb-3 -mb-3 flex flex-col justify-center">
                        <div class="flex justify-between items-baseline mb-1">
                            <h3 class="text-sm font-medium text-[#e9edef] truncate">${chat.name}</h3>
                            <span class="text-[11px] ${chat.unread > 0 ? 'text-[#00a884] font-medium' : 'text-[#8696a0]'} ml-2 flex-shrink-0">${chat.time}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <p class="text-xs text-[#8696a0] truncate pr-2">${chat.subtext}</p>
                            <div class="flex items-center space-x-1 flex-shrink-0">
                                ${chat.pinned ? '<i class="fa-solid fa-thumbtack text-[11px] text-[#8696a0]"></i>' : ''}
                                ${chat.unread > 0 ? `<span class="bg-[#00a884] text-[#111b21] text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">${chat.unread}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(chatEl);
            });
        }

        function renderActiveChat() {
            const chat = chatsData.find(c => c.id === activeChatId);
            if (!chat) return;

            // Update header info
            document.getElementById('header-title').innerText = chat.name;
            document.getElementById('header-subtitle').innerText = chat.participants;
            document.getElementById('header-avatar').src = chat.avatar;

            // Render messages
            const msgContainer = document.getElementById('messages-container');
            msgContainer.innerHTML = '';

            chat.messages.forEach(msg => {
                if (msg.dateDivider) {
                    msgContainer.innerHTML += `
                        <div class="flex justify-center my-2">
                            <span class="bg-[#182229] text-[#8696a0] text-[11px] px-3 py-1 rounded-lg uppercase tracking-wider shadow-sm">${msg.dateDivider}</span>
                        </div>
                    `;
                    return;
                }

                const isIncoming = msg.isIncoming !== false;
                const bubbleBg = isIncoming ? 'bg-[#202c33]' : 'bg-[#005c4b]';
                const alignment = isIncoming ? 'self-start' : 'self-end';

                let replyHtml = '';
                if (msg.replyTo) {
                    replyHtml = `
                        <div class="bg-[#111b21]/40 border-l-4 border-[#00a884] p-1.5 mb-1 rounded text-xs">
                            <p class="font-bold text-[#00a884] text-[11px]">${msg.replyTo.sender}</p>
                            <p class="text-[#8696a0] truncate">${msg.replyTo.text.replace(/<br>/g, ' ')}</p>
                        </div>
                    `;
                }

                const msgEl = document.createElement('div');
                msgEl.className = `max-w-[85%] md:max-w-[65%] rounded-lg p-2.5 px-3 shadow-sm ${bubbleBg} ${alignment} relative group text-sm text-[#e9edef] my-0.5`;
                
                // Color-code incoming group senders with distinct soft hues matching real WhatsApp
                let senderHeader = '';
                if (isIncoming && chat.isGroup) {
                    // Generate pseudo-random consistent color based on sender name
                    const colors = ['text-[#f15c6d]', 'text-[#f3b742]', 'text-[#53bdeb]', 'text-[#25d366]', 'text-[#d97706]'];
                    let hash = 0;
                    for (let i = 0; i < msg.sender.length; i++) hash = msg.sender.charCodeAt(i) + ((hash << 5) - hash);
                    const colorClass = colors[Math.abs(hash) % colors.length];
                    senderHeader = `<p class="text-xs font-bold ${colorClass} mb-0.5 cursor-pointer hover:underline">${msg.sender}</p>`;
                }

                msgEl.innerHTML = `
                    ${senderHeader}
                    ${replyHtml}
                    <div class="leading-relaxed break-words pr-12">${msg.text}</div>
                    <div class="flex items-center justify-end space-x-1 float-right mt-1 ml-3 select-none">
                        <span class="text-[10px] text-[#8696a0]">${msg.time}</span>
                        ${!isIncoming ? '<i class="fa-solid fa-check-double text-[11px] text-[#53bdeb]"></i>' : ''}
                    </div>
                `;
                msgContainer.appendChild(msgEl);
            });

            // Scroll to bottom
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        function selectChat(id) {
            activeChatId = id;
            const chat = chatsData.find(c => c.id === id);
            if (chat) {
                chat.unread = 0;
            }
            renderChatList(document.getElementById('chat-search').value);
            renderActiveChat();
        }

        document.getElementById('chat-search').addEventListener('input', (e) => {
            renderChatList(e.target.value);
        });

        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.getElementById('send-icon');

        messageInput.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                sendIcon.className = 'fa-solid fa-paper-plane text-[#00a884]';
                sendBtn.title = 'Send message';
            } else {
                sendIcon.className = 'fa-solid fa-microphone';
                sendBtn.title = 'Send Voice Note / Send';
            }
        });

        function handleSendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const chat = chatsData.find(c => c.id === activeChatId);
            if (chat) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                chat.messages.push({
                    sender: 'You',
                    text: text,
                    time: timeStr,
                    isIncoming: false
                });

                chat.subtext = `You: ${text}`;
                chat.time = 'Just now';

                messageInput.value = '';
                sendIcon.className = 'fa-solid fa-microphone';
                sendBtn.title = 'Send Voice Note / Send';

                renderActiveChat();
                renderChatList(document.getElementById('chat-search').value);
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        // Initial render on load
        window.onload = function() {
            renderChatList();
            renderActiveChat();
        };
    </script>
</body>
</html>
