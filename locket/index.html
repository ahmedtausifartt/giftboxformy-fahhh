<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Pendant – 3D Locket Opening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0a0f;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }

        #info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 180, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(30, 20, 25, 0.6);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 180, 140, 0.15);
            pointer-events: none;
            white-space: nowrap;
        }

        #ui-hint {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 200, 170, 0.6);
            font-size: 13px;
            letter-spacing: 1px;
            background: rgba(20, 12, 16, 0.5);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 180, 140, 0.08);
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #ffd8c0;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 0 40px rgba(255, 100, 80, 0.6), 0 0 80px rgba(255, 60, 40, 0.3);
            opacity: 0;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            font-family: 'Georgia', serif;
            background: radial-gradient(circle, rgba(255, 200, 180, 0.15), transparent 70%);
            padding: 30px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255, 180, 150, 0.1);
        }
        #message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #sparkle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #ffd8c0, #ff6b4a);
            border-radius: 50%;
            opacity: 0;
            animation: sparkleAnim 2s ease-in-out infinite;
            box-shadow: 0 0 12px #ff6b4a88;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0;
                transform: scale(0) translateY(0);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: scale(0) translateY(-60px);
            }
        }

        @media (max-width: 600px) {
            #info {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 16px;
            }
            #ui-hint {
                font-size: 10px;
                padding: 4px 12px;
                top: 16px;
            }
            #message {
                font-size: 18px;
                padding: 20px 30px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <div id="ui-hint">✦ click or drag to interact ✦</div>
    <div id="info">❤︎ love pendant · locket opening ❤︎</div>
    <div id="message">∞ forever ∞</div>
    <div id="sparkle-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ─── Scene Setup ─────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0a0f);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.2, 2.0, 5.5);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ─── Controls ────────────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.5;
        controls.maxDistance = 12;
        controls.target.set(0, 0.2, 0);
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.8;

        // ─── Post Processing ─────────────────────────────────────────
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3, // strength
            0.4, // radius
            0.2 // threshold
        );
        composer.addPass(bloomPass);

        // ─── Lighting ────────────────────────────────────────────────
        const ambient = new THREE.AmbientLight(0x44333a, 0.5);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xffd8c0, 2.0);
        keyLight.position.set(4, 6, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x8866aa, 0.6);
        fillLight.position.set(-3, 1, -2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffaa88, 0.8);
        rimLight.position.set(-2, 3, -5);
        scene.add(rimLight);

        const backLight = new THREE.DirectionalLight(0x4422aa, 0.3);
        backLight.position.set(0, -1, -6);
        scene.add(backLight);

        const pointGlow = new THREE.PointLight(0xff4433, 0.6, 8);
        pointGlow.position.set(0, 0.2, 0.5);
        scene.add(pointGlow);

        // subtle environment
        const hemi = new THREE.HemisphereLight(0x664466, 0x332233, 0.6);
        scene.add(hemi);

        // ─── Ground / Environment ──────────────────────────────────
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.3, color: 0x000000 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // particles background
        const starCount = 400;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 40;
            if (i % 3 === 1) starPos[i] = (Math.random() - 0.5) * 20 + 2;
            if (i % 3 === 2) starPos[i] = (Math.random() - 0.5) * 40 - 10;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffccbb,
            size: 0.04,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ─── Heart Shape (param) ────────────────────────────────────
        function generateHeartPoints(numPts = 80) {
            const pts = [];
            for (let i = 0; i <= numPts; i++) {
                const t = (i / numPts) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                pts.push({ x: x / 16, y: y / 16 });
            }
            return pts;
        }

        function createHalfShape(points, side) {
            // side: 'left' or 'right'
            const shape = new THREE.Shape();
            const halfPts = points.filter(p => {
                if (side === 'left') return p.x <= 0;
                else return p.x >= 0;
            });

            // sort: for left, from bottom to top along left side; for right, from bottom to top along right side
            // We need to order them properly.
            // The heart points go: t=0 → bottom (0, ~0.81), t=π/2 → right, t=π → top, t=3π/2 → left
            // For left side: t from π to 2π (bottom → left → top)
            // For right side: t from 0 to π (bottom → right → top)

            let ordered = [];
            if (side === 'left') {
                // t from π to 2π
                for (let i = 0; i < points.length; i++) {
                    const frac = i / points.length;
                    const t = frac * Math.PI * 2;
                    if (t >= Math.PI && t <= Math.PI * 2) {
                        ordered.push(points[i]);
                    }
                }
                // ensure we go from bottom → left → top
                // bottom is at t=2π (or 0), top is at t=π
                // actually we want bottom → left → top → back to bottom (center)
                // Reorder: from t=2π down to t=π (going backwards through left side)
                const bottomIdx = ordered.findIndex(p => p.x === 0 && p.y < 0);
                // simpler: just use the points as-is, but ensure closure
            } else {
                // right side: t from 0 to π
                for (let i = 0; i < points.length; i++) {
                    const frac = i / points.length;
                    const t = frac * Math.PI * 2;
                    if (t >= 0 && t <= Math.PI) {
                        ordered.push(points[i]);
                    }
                }
                // bottom → right → top
            }

            // If empty, fallback
            if (ordered.length < 3) {
                // fallback simple heart half
                if (side === 'left') {
                    shape.moveTo(0, 0);
                    shape.bezierCurveTo(0, -0.3, -0.6, -0.6, -0.6, 0);
                    shape.bezierCurveTo(-0.6, 0.5, -0.2, 0.8, 0, 1.0);
                    shape.lineTo(0, 0);
                } else {
                    shape.moveTo(0, 0);
                    shape.bezierCurveTo(0, -0.3, 0.6, -0.6, 0.6, 0);
                    shape.bezierCurveTo(0.6, 0.5, 0.2, 0.8, 0, 1.0);
                    shape.lineTo(0, 0);
                }
                return shape;
            }

            // Build shape from ordered points
            shape.moveTo(ordered[0].x, ordered[0].y);
            for (let i = 1; i < ordered.length; i++) {
                shape.lineTo(ordered[i].x, ordered[i].y);
            }
            // close back to center along the cut
            // find the top point (max y) and bottom point (min y)
            let topY = -Infinity,
                bottomY = Infinity;
            let topP = null,
                bottomP = null;
            for (const p of ordered) {
                if (p.y > topY) { topY = p.y;
                    topP = p; }
                if (p.y < bottomY) { bottomY = p.y;
                    bottomP = p; }
            }
            // close along the center line from top to bottom
            shape.lineTo(0, topY);
            shape.lineTo(0, bottomY);
            shape.lineTo(ordered[0].x, ordered[0].y);

            return shape;
        }

        // Generate full heart points
        const heartPts = generateHeartPoints(120);

        // Create left and right shapes
        const leftShape = createHalfShape(heartPts, 'left');
        const rightShape = createHalfShape(heartPts, 'right');

        // ─── Create 3D Heart Halves ──────────────────────────────────
        const extrudeSettings = {
            depth: 0.32,
            bevelEnabled: true,
            bevelThickness: 0.08,
            bevelSize: 0.04,
            bevelSegments: 8,
        };

        // Materials
        const goldMat = new THREE.MeshPhysicalMaterial({
            color: 0xdd8844,
            metalness: 0.75,
            roughness: 0.25,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
            envMapIntensity: 1.2,
            emissive: 0x662200,
            emissiveIntensity: 0.08,
        });

        const innerMat = new THREE.MeshPhysicalMaterial({
            color: 0xff6644,
            metalness: 0.1,
            roughness: 0.3,
            emissive: 0xff3322,
            emissiveIntensity: 0.4,
            transparent: true,
            opacity: 0.92,
            clearcoat: 0.1,
        });

        const innerGlowMat = new THREE.MeshPhysicalMaterial({
            color: 0xff8866,
            metalness: 0.0,
            roughness: 0.2,
            emissive: 0xff4433,
            emissiveIntensity: 1.2,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide,
        });

        // Left half
        const leftGeo = new THREE.ExtrudeGeometry(leftShape, extrudeSettings);
        leftGeo.computeVertexNormals();
        const leftMesh = new THREE.Mesh(leftGeo, goldMat);
        leftMesh.castShadow = true;
        leftMesh.receiveShadow = true;
        leftMesh.position.set(0, 0, -0.16);

        // Right half
        const rightGeo = new THREE.ExtrudeGeometry(rightShape, extrudeSettings);
        rightGeo.computeVertexNormals();
        const rightMesh = new THREE.Mesh(rightGeo, goldMat);
        rightMesh.castShadow = true;
        rightMesh.receiveShadow = true;
        rightMesh.position.set(0, 0, -0.16);

        // ─── Inner glow surfaces (on the cut face) ──────────────────
        function createInnerSurface(shape, colorMat, offsetX = 0) {
            const pts = shape.getPoints(40);
            const s = new THREE.Shape();
            s.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                s.lineTo(pts[i].x, pts[i].y);
            }
            s.lineTo(pts[0].x, pts[0].y);

            const geo = new THREE.ShapeGeometry(s);
            const mesh = new THREE.Mesh(geo, colorMat);
            // position on the cut face
            mesh.position.set(offsetX, 0, 0.16);
            mesh.rotation.y = 0;
            return mesh;
        }

        // Inner surfaces - positioned at the cut plane
        const leftInner = createInnerSurface(leftShape, innerMat, 0);
        const rightInner = createInnerSurface(rightShape, innerMat, 0);

        // Glow layers
        const glowMatL = innerGlowMat.clone();
        glowMatL.emissiveIntensity = 1.0;
        const glowMatR = innerGlowMat.clone();
        glowMatR.emissiveIntensity = 1.0;

        const leftGlow = createInnerSurface(leftShape, glowMatL, 0.01);
        leftGlow.scale.set(0.85, 0.85, 1);
        leftGlow.position.z = 0.18;

        const rightGlow = createInnerSurface(rightShape, glowMatR, -0.01);
        rightGlow.scale.set(0.85, 0.85, 1);
        rightGlow.position.z = 0.18;

        // ─── Group halves ────────────────────────────────────────────
        const leftGroup = new THREE.Group();
        leftGroup.add(leftMesh);
        leftGroup.add(leftInner);
        leftGroup.add(leftGlow);
        leftGroup.position.set(0, 0.15, 0);

        const rightGroup = new THREE.Group();
        rightGroup.add(rightMesh);
        rightGroup.add(rightInner);
        rightGroup.add(rightGlow);
        rightGroup.position.set(0, 0.15, 0);

        // Pivot groups for rotation
        const pivotL = new THREE.Group();
        pivotL.add(leftGroup);
        pivotL.position.set(0, 0.15, 0);

        const pivotR = new THREE.Group();
        pivotR.add(rightGroup);
        pivotR.position.set(0, 0.15, 0);

        scene.add(pivotL);
        scene.add(pivotR);

        // Store for animation
        const halves = { left: pivotL, right: pivotR, leftGroup, rightGroup };

        // ─── Decorative Chain / Bail ─────────────────────────────────
        function createBail() {
            const group = new THREE.Group();

            // top ring
            const ringGeo = new THREE.TorusGeometry(0.18, 0.04, 12, 24);
            const ringMat = new THREE.MeshPhysicalMaterial({
                color: 0xdd9955,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0x442200,
