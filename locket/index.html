<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Pendant – Locket Opening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0a0f;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 200, 170, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            background: rgba(20, 12, 16, 0.5);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 180, 140, 0.08);
            pointer-events: none;
            backdrop-filter: blur(4px);
            user-select: none;
            white-space: nowrap;
        }
        #info {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 180, 0.4);
            font-size: 13px;
            letter-spacing: 2px;
            background: rgba(30, 20, 25, 0.5);
            padding: 8px 22px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 180, 140, 0.1);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #ffd8c0;
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 8px;
            text-shadow: 0 0 60px rgba(255, 100, 80, 0.5), 0 0 120px rgba(255, 60, 40, 0.2);
            opacity: 0;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            font-family: 'Georgia', serif;
            background: radial-gradient(circle, rgba(255, 200, 180, 0.1), transparent 70%);
            padding: 30px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255, 180, 150, 0.08);
        }
        #message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        @media (max-width: 600px) {
            #info {
                font-size: 10px;
                padding: 4px 14px;
                bottom: 16px;
            }
            #ui-hint {
                font-size: 10px;
                padding: 4px 12px;
                top: 12px;
            }
            #message {
                font-size: 20px;
                padding: 20px 30px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <div id="ui-hint">✦ click & drag to orbit ✦</div>
    <div id="info">❤︎ love pendant · locket opening ❤︎</div>
    <div id="message">∞ forever ∞</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ─── Scene ──────────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0a0f);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(3.0, 1.8, 4.8);
        camera.lookAt(0, 0.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        // ─── Controls ──────────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.0;
        controls.maxDistance = 12;
        controls.target.set(0, 0.1, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        // ─── Post-processing ───────────────────────────────────────
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.35, 0.4, 0.2
        );
        composer.addPass(bloom);

        // ─── Lighting ──────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x44333a, 0.4));

        const key = new THREE.DirectionalLight(0xffd8c0, 2.2);
        key.position.set(4, 6, 4);
        key.castShadow = true;
        key.shadow.mapSize.width = 1024;
        key.shadow.mapSize.height = 1024;
        scene.add(key);

        const fill = new THREE.DirectionalLight(0x8866aa, 0.5);
        fill.position.set(-3, 1, -2);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffaa88, 0.7);
        rim.position.set(-2, 3, -5);
        scene.add(rim);

        const hemi = new THREE.HemisphereLight(0x664466, 0x221122, 0.5);
        scene.add(hemi);

        const glowPoint = new THREE.PointLight(0xff4433, 0.5, 6);
        glowPoint.position.set(0, 0.1, 0.8);
        scene.add(glowPoint);

        // ─── Ground shadow catcher ──────────────────────────────────
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.ShadowMaterial({ opacity: 0.25, color: 0x000000 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.45;
        ground.receiveShadow = true;
        scene.add(ground);

        // ─── Starfield ─────────────────────────────────────────────
        const starCount = 500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 50;
            if (i % 3 === 1) starPos[i] = (Math.random() - 0.5) * 20 + 2;
            if (i % 3 === 2) starPos[i] = (Math.random() - 0.5) * 40 - 10;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffccbb,
            size: 0.035,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
        });
        scene.add(new THREE.Points(starGeo, starMat));

        // ─── Heart Geometry Helpers ────────────────────────────────
        function getHeartPoints(num = 100) {
            const pts = [];
            for (let i = 0; i <= num; i++) {
                const t = (i / num) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                pts.push({ x: x / 17, y: y / 17 });
            }
            return pts;
        }

        function buildHalfShape(points, side) {
            const shape = new THREE.Shape();
            let filtered;
            if (side === 'left') {
                filtered = points.filter(p => p.x <= 0);
                // sort by angle to ensure proper winding: bottom → left → top
                filtered.sort((a, b) => {
                    const angA = Math.atan2(a.y, a.x);
                    const angB = Math.atan2(b.y, b.x);
                    return angA - angB;
                });
            } else {
                filtered = points.filter(p => p.x >= 0);
                filtered.sort((a, b) => {
                    const angA = Math.atan2(a.y, a.x);
                    const angB = Math.atan2(b.y, b.x);
                    return angA - angB;
                });
            }
            if (filtered.length < 3) {
                // fallback
                shape.moveTo(0, -0.5);
                shape.quadraticCurveTo(side === 'left' ? -0.6 : 0.6, -0.6, side === 'left' ? -0.6 : 0.6, 0);
                shape.quadraticCurveTo(side === 'left' ? -0.6 : 0.6, 0.6, 0, 0.8);
                shape.lineTo(0, -0.5);
                return shape;
            }
            shape.moveTo(filtered[0].x, filtered[0].y);
            for (let i = 1; i < filtered.length; i++) {
                shape.lineTo(filtered[i].x, filtered[i].y);
            }
            // close along the center cut
            const top = filtered.reduce((a, b) => a.y > b.y ? a : b);
            const bottom = filtered.reduce((a, b) => a.y < b.y ? a : b);
            shape.lineTo(0, top.y);
            shape.lineTo(0, bottom.y);
            shape.lineTo(filtered[0].x, filtered[0].y);
            return shape;
        }

        const heartPts = getHeartPoints(140);
        const leftShape = buildHalfShape(heartPts, 'left');
        const rightShape = buildHalfShape(heartPts, 'right');

        // ─── Materials ──────────────────────────────────────────────
        const goldMat = new THREE.MeshPhysicalMaterial({
            color: 0xdd8844,
            metalness: 0.8,
            roughness: 0.2,
            clearcoat: 0.3,
            clearcoatRoughness: 0.3,
            emissive: 0x552200,
            emissiveIntensity: 0.06,
        });

        const innerMat = new THREE.MeshPhysicalMaterial({
            color: 0xff6644,
            metalness: 0.05,
            roughness: 0.2,
            emissive: 0xff3322,
            emissiveIntensity: 0.6,
            transparent: true,
            opacity: 0.9,
        });

        const glowMat = new THREE.MeshPhysicalMaterial({
            color: 0xff8866,
            metalness: 0,
            roughness: 0.1,
            emissive: 0xff4433,
            emissiveIntensity: 1.5,
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide,
        });

        const extrudeSettings = {
            depth: 0.30,
            bevelEnabled: true,
            bevelThickness: 0.07,
            bevelSize: 0.04,
            bevelSegments: 8,
        };

        // ─── Build halves ────────────────────────────────────────────
        function createHalf(shape, xOffset) {
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.computeVertexNormals();
            const mesh = new THREE.Mesh(geo, goldMat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.set(0, 0, -0.15);

            // inner face (cut plane)
            const faceShape = shape.clone();
            const faceGeo = new THREE.ShapeGeometry(faceShape);
            const face = new THREE.Mesh(faceGeo, innerMat);
            face.position.set(0, 0, 0.15);

            // glow overlay
            const glowShape = shape.clone();
            const glowGeo = new THREE.ShapeGeometry(glowShape);
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.set(0, 0, 0.17);
            glow.scale.set(0.82, 0.82, 1);

            const group = new THREE.Group();
            group.add(mesh);
            group.add(face);
            group.add(glow);
            return group;
        }

        const leftGroup = createHalf(leftShape, 0);
        const rightGroup = createHalf(rightShape, 0);

        // ─── Pivots for opening animation ──────────────────────────
        const pivotL = new THREE.Group();
        pivotL.add(leftGroup);
        pivotL.position.set(0, 0.1, 0);

        const pivotR = new THREE.Group();
        pivotR.add(rightGroup);
        pivotR.position.set(0, 0.1, 0);

        scene.add(pivotL);
        scene.add(pivotR);

        // ─── Bail (top ring) ────────────────────────────────────────
        function createBail() {
            const g = new THREE.Group();

            // main ring
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.18, 0.04, 16, 28),
                new THREE.MeshPhysicalMaterial({
                    color: 0xdd9955,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: 0x442200,
                    emissiveIntensity: 0.1,
                })
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.5;
            ring.castShadow = true;
            g.add(ring);

            // small loop underneath
            const loop = new THREE.Mesh(
                new THREE.TorusGeometry(0.07, 0.025, 12, 18),
                new THREE.MeshPhysicalMaterial({
                    color: 0xdd9955,
                    metalness: 0.8,
                    roughness: 0.25,
                })
            );
            loop.position.set(0, 0.32, 0);
            loop.castShadow = true;
            g.add(loop);

            // tiny connectors
            for (let side of [-1, 1]) {
                const bar = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.015, 0.015, 0.12, 6),
                    new THREE.MeshPhysicalMaterial({
                        color: 0xdd9955,
                        metalness: 0.8,
                        roughness: 0.25,
                    })
                );
                bar.position.set(side * 0.1, 0.40, 0);
                bar.rotation.z = side * 0.15;
                bar.castShadow = true;
                g.add(bar);
            }

            return g;
        }

        const bail = createBail();
        scene.add(bail);

        // ─── Inner sparkle gems ─────────────────────────────────────
        const gemMat = new THREE.MeshPhysicalMaterial({
            color: 0xff5577,
            emissive: 0xff2244,
            emissiveIntensity: 0.8,
            metalness: 0.1,
            roughness: 0.1,
            transparent: true,
            opacity: 0.9,
            envMapIntensity: 0.5,
        });

        const gems = [];
        for (let i = 0; i < 7; i++) {
            const size = 0.03 + Math.random() * 0.04;
            const gem = new THREE.Mesh(new THREE.OctahedronGeometry(size, 0), gemMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.1 + Math.random() * 0.25;
            gem.position.set(
                Math.cos(angle) * radius,
                Math.sin(angle) * radius * 0.8 + 0.1,
                0.18
            );
            gem.userData = {
                phase: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 0.8,
                baseY: gem.position.y,
            };
            scene.add(gem);
            gems.push(gem);
        }

        // ─── Animation state ────────────────────────────────────────
        let isOpen = false;
        let openProgress = 0; // 0 = closed, 1 = open
        const targetOpen = 0.75; // radians

        const messageEl = document.getElementById('message');

        // ─── Click to toggle ────────────────────────────────────────
        renderer.domElement.addEventListener('click', () => {
            isOpen = !isOpen;
            if (isOpen) {
                messageEl.classList.add('show');
                controls.autoRotate = false;
            } else {
                messageEl.classList.remove('show');
                controls.autoRotate = true;
            }
        });

        // also toggle on touch for mobile
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isOpen = !isOpen;
                if (isOpen) {
                    messageEl.classList.add('show');
                    controls.autoRotate = false;
                } else {
                    messageEl.classList.remove('show');
                    controls.autoRotate = true;
                }
            }
        });

        // ─── Resize ──────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // ─── Render Loop ─────────────────────────────────────────────
        const clock = new THREE.Clock();

        function animate() {
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            // smooth open/close
            const speed = 2.8;
            if (isOpen && openProgress < 1) {
                openProgress = Math.min(openProgress + dt * speed, 1);
            } else if (!isOpen && openProgress > 0) {
                openProgress = Math.max(openProgress - dt * speed, 0);
            }

            // ease in-out
            const ease = openProgress * openProgress * (3 - 2 * openProgress);
            const angle = ease * targetOpen;

            // rotate halves around Y axis at their inner edge
            pivotL.rotation.y = -angle;
            pivotR.rotation.y = angle;

            // slight outward translation for realism
            const spread = ease * 0.08;
            pivotL.position.x = -spread;
            pivotR.position.x = spread;

            // glow pulse
            const pulse = 0.7 + 0.3 * Math.sin(time * 1.5);
            glowMat.emissiveIntensity = 0.8 + pulse * 0.8;

            // twinkle gems
            for (const gem of gems) {
                const u = gem.userData;
                const scale = 0.7 + 0.5 * Math.sin(time * u.speed + u.phase);
                gem.scale.set(scale, scale, scale);
                gem.position.y = u.baseY + 0.02 * Math.sin(time * u.speed * 0.7 + u.phase);
                gem.rotation.x += dt * 0.5;
                gem.rotation.z += dt * 0.3;
            }

            // bail subtle sway
            bail.rotation.z = 0.04 * Math.sin(time * 0.6);
            bail.rotation.x = 0.02 * Math.sin(time * 0.4 + 1);

            // update controls
            controls.update();

            // render with bloom
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();

        // small delay to show initial state
        setTimeout(() => {
            controls.autoRotate = true;
        }, 500);

        console.log('❤️ Love Pendant — click to open/close');
    </script>
</body>
</html>
